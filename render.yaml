services:
  - type: web
    name: aminah-elearning
    runtime: docker
    plan: starter
    healthCheckPath: /actuator/health/readiness
    disk:
      name: aminah-uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: true
      - key: APP_SEED_ENABLED
        value: false
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: false
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_FULL_NAME
        sync: false
      - key: AWS_ENABLED
        value: false
      - key: PAYMOB_ENABLED
        value: false
      - key: APP_EMAIL_ENABLED
        value: false
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_MERCHANT_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
