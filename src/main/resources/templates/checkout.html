<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<section layout:fragment="content" class="container py-5">
    <div class="card shadow-sm mx-auto p-4" style="max-width: 36rem;">
        <h1 class="h3">Course checkout</h1>
        <h2 class="h5" th:text="${course.title}">Course name</h2>
        <p th:text="${'Price: ' + course.price + ' EGP'}"></p>
        <p th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></p>
        <p class="text-muted">Paid lessons stay locked until payment is confirmed by the payment provider.</p>
        <form th:action="@{/payments/create/{id}(id=${course.id})}" method="post">
            <button type="submit" class="btn btn-primary w-100" th:text="${error != null ? 'Retry payment' : 'Proceed to pay'}">Proceed to pay</button>
        </form>
        <a class="mt-3" th:href="@{/student/course/{id}(id=${course.id})}">Back to course</a>
    </div>
</section>
</html>
