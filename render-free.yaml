# Free compute with external PostgreSQL and PRIVATE durable object storage.
# Select this file explicitly in Render; render.yaml retains the disk-backed option.
# Provider accounts, quotas, spending limits and a deployed smoke test are still required.
services:
  - type: web
    name: aminah-elearning-free
    runtime: docker
    plan: free
    branch: codex/finalize-elearning
    autoDeployTrigger: "off"
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: APP_URL
        sync: false
      # JDBC URL, not postgresql://user:password@host/db. Use a separate new database.
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: "true"
      - key: APP_SEED_ENABLED
        value: "false"
      - key: EMBEDDED_POSTGRES_ENABLED
        value: "false"
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: AWS_ENABLED
        value: "true"
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_FOLDER
        value: tutorials
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: APP_EMAIL_ENABLED
        value: "true"
      - key: APP_EMAIL_PROVIDER
        value: sendgrid
      - key: APP_EMAIL_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Enable sandbox checkout only after adding the existing PAYMOB_* settings.
      - key: PAYMOB_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=10.0 -XX:+ExitOnOutOfMemoryError
