zonky.test.database.provider=embedded
app.embedded-postgres.enabled=false
app.seed.enabled=false
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:}

#JPA
spring.jpa.properties.hibernate.format_sql=true

#logging.level.org.hibernate.type=TRACE

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#thymleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# File upload
file.upload-dir=uploads

# Paymob URLs
paymob.url.auth=https://accept.paymob.com/api/auth/tokens
paymob.url.order=https://accept.paymob.com/api/ecommerce/orders
paymob.url.paymentKey=https://accept.paymob.com/api/acceptance/payment_keys
paymob.url.pay=https://accept.paymob.com/api/acceptance/iframes/
paymob.url.callback=https://accept.paymob.com/api/acceptance/iframes/

# Paymob credentials
paymob.apiKey=${PAYMOB_API_KEY}
paymob.integrationId=${PAYMOB_INTEGRATION_ID}
paymob.iframeId=${PAYMOB_IFRAME_ID}

# Paymob (SANDBOX) - replace with your sandbox keys
paymob.api.key=${PAYMOB_API_KEY}
paymob.integration.id=${PAYMOB_INTEGRATION_ID}
paymob.merchant.id=${PAYMOB_MERCHANT_ID}
paymob.hmac=${PAYMOB_HMAC_SECRET}
paymob.iframe.id=${PAYMOB_IFRAME_ID}

# Paymob SANDBOX endpoints
paymob.auth.url=https://accept.paymobsolutions.com/api/auth/tokens
paymob.order.url=https://accept.paymobsolutions.com/api/ecommerce/orders
paymob.payment.key.url=https://accept.paymobsolutions.com/api/acceptance/payment_keys
paymob.iframe.url=https://accept.paymobsolutions.com/api/acceptance/iframes/

# Mail
app.email.enabled=${APP_EMAIL_ENABLED:true}
app.email.provider=${APP_EMAIL_PROVIDER:sendgrid}
app.email.from=${APP_EMAIL_FROM}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.from=${MAIL_FROM:${APP_EMAIL_FROM:}}
spring.mail.default-encoding=UTF-8
########gridMail
sendgrid.api-key=${SENDGRID_API_KEY:}
spring.sendgrid.api-key=${SENDGRID_API_KEY:}


#admin credentials
spring.security.user.name=${BASIC_AUTH_USER:admin}
spring.security.user.password=${BASIC_AUTH_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
