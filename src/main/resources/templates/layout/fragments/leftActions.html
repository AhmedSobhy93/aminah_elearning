<div th:fragment="leftActions">

    <!-- LEFT ACTION BAR -->
    <div id="leftActionBar">
        <button class="action-btn" data-label="Dashboard" th:onclick="|window.location='@{/}'|">
            <i class="fas fa-tachometer-alt"></i>
        </button>

        <button class="action-btn" data-label="Courses" sec:authorize="hasRole('DR')"
                th:onclick="|window.location='@{/dr/courses}'|">
            <i class="fas fa-book"></i>
        </button>

        <button class="action-btn" data-label="Users" sec:authorize="hasRole('ADMIN')"
                th:onclick="|window.location='@{/admin/users}'|">
            <i class="fas fa-cog"></i>
        </button>

        <button class="action-btn" data-label="Profile" th:onclick="|window.location='@{/profile/profile}'|">
            <i class="fas fa-user-circle"></i>
        </button>

        <button class="action-btn" id="helpToggle" data-label="Help">
            <i class="fas fa-question-circle"></i>
        </button>
    </div>



    <!-- HELP PANEL -->
    <div id="floatingHelpPanel">
        <h5 class="mb-3">Quick Help</h5>
        <div class="list-group small">
            <a th:href="@{/}" class="list-group-item list-group-item-action">Dashboard</a>
            <a th:href="@{/student/courses}" sec:authorize="hasRole('STUDENT')" class="list-group-item list-group-item-action">Browse Courses</a>
            <a th:href="@{/dr/courses}" sec:authorize="hasRole('DR')" class="list-group-item list-group-item-action">Manage Courses</a>
            <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')" class="list-group-item list-group-item-action">Manage Users</a>
            <a th:href="@{/contact}" class="list-group-item list-group-item-action">Contact Support</a>
        </div>
    </div>

</div>
