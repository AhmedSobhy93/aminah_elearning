<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<section layout:fragment="content">

<!-- New Design Starts -->
<section class="banner courses archive section">
    <span th:if="${message}">
    <h1 style="text-align: center; padding-bottom:200px;color: #4B5563;" th:text="${message}"></h1>
    </span>
    <span th:if="!${message}">
<!--    <h1 style="text-align: center;color: #4B5563;" th:text="${title}"></h1>-->
    </span>

        <div class="container mt-5">
            <div class="row g-4">

                <!-- Sidebar (Course Outline / Progress) -->
                <aside class="col-lg-4 col-md-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0" th:text="${course.courseName}">Course Title</h5>
                        </div>
                        <div class="card-body">
                            <p class="text-muted" th:text="${course.description}"></p>

                            <div class="mb-3">
                                <strong>Instructor:</strong>
                                <span th:text="${course.author != null ? course.author.fullName : 'Instructor unavailable'}"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Created At:</strong>
                                <span th:text="${course.createdAt}"></span>
                            </div>

                            <div class="mb-3">
                                <strong>Price:</strong>
                                <span th:if="${course.price == 0}" class="text-success fw-bold">FREE</span>
                                <span th:if="${course.price != 0}" class="text-primary fw-bold" th:text="${'EGP' + course.price}"></span>
                            </div>

<!--                            <div class="mb-3">-->
<!--                                <strong>Progress:</strong>-->
<!--                                <div class="progress mt-1" style="height: 8px;">-->
<!--                                    <div class="progress-bar bg-success" role="progressbar"-->
<!--                                         th:style="'width:' + ${progress} + '%'" th:text="${progress + '%'}"></div>-->
<!--                                </div>-->
<!--                            </div>-->

                            <div class="d-grid gap-2">
                                <span class="badge bg-secondary" th:text="${course.published ? 'Published' : 'Draft'}"></span>
                                <a th:href="@{/admin/courses}" class="btn btn-outline-primary">Back to course review</a>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="col-lg-8 col-md-7">
                    <h1 th:text="${course.title}">Course review</h1>
                    <p>Review the course structure and publication status.</p>
                    <p th:if="${#lists.isEmpty(course.sections)}" class="alert alert-info">No sections have been added yet.</p>
                    <article th:each="section : ${course.sections}" class="card mb-3">
                        <div class="card-body">
                            <h2 class="h5" th:text="${section.title}">Section</h2>
                            <p th:text="${section.description}"></p>
                            <ul>
                                <li th:each="tutorial : ${section.tutorials}">
                                    <span th:text="${tutorial.title}"></span>
                                    <span class="text-muted" th:text="${tutorial.type}"></span>
                                </li>
                            </ul>
                        </div>
                    </article>
                </main>
            </div>
        </div>

</section>
<!-- New Design End -->
</section>
