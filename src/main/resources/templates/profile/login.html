<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<section layout:fragment="content">
    <span th:if="${message}">
        <h1 style="text-align: center; padding-bottom:200px;color: #4B5563;" th:text="${message}"></h1>
    </span>
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="profile-icon"><i class="fas fa-user-circle"></i></div>
            <h3>Login</h3>
            <div th:if="${param.error != null}" class="alert alert-danger" role="alert">
                Sign-in failed. Check your username and password and try again.
            </div>
            <div th:if="${param.logout != null}" class="alert alert-success" role="status">
                You have been signed out successfully.
            </div>
            <form th:action="@{/profile/login}" method="post">
                <label for="login-username">Username</label><input id="login-username" type="text" name="username" autocomplete="username" placeholder="Username" required />
                <label for="login-password">Password</label><input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="Password" required />
                <button type="submit" class="btn btn-aminah">Login</button>
            </form>
            <p class="mt-2">
                <a th:href="@{/forgot-password}">Forgot password?</a><br/>
                Don't have an account? <a th:href="@{/profile/register}">Register</a>
            </p>
        </div>
    </div>
</section>
</html>
