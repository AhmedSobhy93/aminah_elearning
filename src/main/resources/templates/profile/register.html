<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{'layout/base'}">
<section layout:fragment="content">
    <span th:if="${message}">
    <h1 style="text-align: center; padding-bottom:200px;color: #4B5563;" th:text="${message}"></h1>
    </span>
    <div class="d-flex justify-content-center align-items-center vh-50">
<!--        <div class="card shadow-lg p-4" style="width: 400px;">-->
<!--            <h3 class="text-center mb-3">Create Account</h3>-->
            <div class="auth-container">
                <div class="auth-card">
                    <div class="profile-icon">📝</div>
                    <h3>Create Account</h3>
                    <form th:action="@{/profile/register}" method="post">
                        <label for="register-full-name">Full Name</label>
                        <input id="register-full-name" type="text" name="fullName" autocomplete="name" placeholder="Full Name" required/>
                        <label for="register-username">Username</label>
                        <input id="register-username" type="text" name="username" autocomplete="username" placeholder="Username" required/>
                        <label for="register-email">Email</label>
                        <input id="register-email" type="email" name="email" autocomplete="email" placeholder="Email" required/>
                        <label for="register-phone">Phone Number</label>
                        <input id="register-phone" type="tel" name="phoneNumber" autocomplete="tel" placeholder="Phone Number" required/>
                        <label for="register-password">Password</label>
                        <input id="register-password" type="password" name="password" autocomplete="new-password" placeholder="Password" required/>
                        <button type="submit" class="btn btn-aminah">Register</button>
                    </form>
                    <form th:action="@{/profile/resend-confirmation}" method="post" class="mt-3">
                        <label for="resend-email">Confirmation email</label>
                        <input id="resend-email" type="email" name="email" autocomplete="email" placeholder="Email" required/>
                        <button type="submit" class="btn btn-outline-secondary w-100">Resend Confirmation</button>
                    </form>
                    <p class="text-success" th:text="${message}"></p>
                    <p class="text-danger" th:text="${error}"></p>
                </div>
            </div>
